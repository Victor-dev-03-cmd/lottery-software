buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Flutter's flutter-gradle-plugin bundles Kotlin; no separate kotlin-gradle-plugin needed.
        classpath 'com.android.tools.build:gradle:8.3.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
