# Render.com deployment specification for Lottery API Server
# Deploy: https://dashboard.render.com/select-repo
# Select this repo, point root directory to api-server/
#
# BEFORE deploying:
#   1. Create a PostgreSQL database on Neon (neon.tech) — free tier
#   2. Copy the connection string from Neon → add it as DATABASE_URL below
#   3. JWT_SECRET is auto-generated by Render on first deploy

services:
  - type: web
    name: lottery-api
    runtime: go
    rootDir: api-server
    buildCommand: go build -o lottery-api-server .
    startCommand: ./lottery-api-server
    plan: free   # upgrade to starter ($7/mo) to prevent spin-down
    envVars:
      - key: DATABASE_URL
        sync: false   # SET THIS MANUALLY in Render dashboard — never commit credentials
      - key: JWT_SECRET
        generateValue: true   # Render generates a random secret automatically
      - key: BOOTSTRAP_TOKEN
        sync: false   # leave empty to auto-generate (server prints to logs on first start)
      # PORT is set automatically by Render — do not add it here
