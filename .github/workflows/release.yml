name: "Publish"

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Build Windows + Linux installers ────────────────────────────────────────
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lottery Manager ${{ github.ref_name }}"
          releaseBody: |
            ## Lottery Manager ${{ github.ref_name }}

            ### Installation
            - **Windows**: Download `Lottery.Manager_*_x64-setup.exe`
            - **Linux (Debian)**: Download `lottery-manager_*_amd64.deb`

            ### In-App Silent Update
            Open **Settings → Software Updates** and click **Check for Updates** — the app will download and restart automatically.

            ---
            *Download the appropriate installer for your platform below.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ── Ensure latest.json exists with real signatures ───────────────────────────
  # tauri-action generates latest.json when TAURI_SIGNING_PRIVATE_KEY is set.
  # This job only uploads a fallback if tauri-action did NOT create one.
  upload-manifest:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check / upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/Victor-dev-03-cmd/lottery-software/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # ── Check if tauri-action already uploaded latest.json ──────────────
          EXISTING=$(gh release view "${TAG}" \
            --repo "Victor-dev-03-cmd/lottery-software" \
            --json assets --jq '.assets[].name' 2>/dev/null | grep '^latest\.json$' || true)

          if [ -n "$EXISTING" ]; then
            echo "✅ latest.json already uploaded by tauri-action — skipping."
            echo "Contents:"
            curl -sL "${BASE}/latest.json" | python3 -m json.tool
            exit 0
          fi

          echo "⚠️  latest.json not found — generating fallback (no signatures)."
          echo "NOTE: Silent install will only work from the NEXT release onwards."
          echo "      Users must manually install this version once."

          # ── Download .sig files if they were built ──────────────────────────
          mkdir -p sigs
          gh release download "${TAG}" \
            --repo "Victor-dev-03-cmd/lottery-software" \
            --pattern "*.sig" \
            --dir ./sigs/ 2>/dev/null || true

          # Read signatures (empty string if not found)
          WIN_SIG_FILE="sigs/Lottery.Manager_${VERSION}_x64-setup.exe.sig"
          LIN_SIG_FILE="sigs/lottery-manager_${VERSION}_amd64.AppImage.sig"
          WIN_SIG=$( [ -f "$WIN_SIG_FILE" ] && cat "$WIN_SIG_FILE" || echo "" )
          LIN_SIG=$( [ -f "$LIN_SIG_FILE" ] && cat "$LIN_SIG_FILE" || echo "" )

          echo "Win sig found: $([ -f "$WIN_SIG_FILE" ] && echo yes || echo no)"
          echo "Linux sig found: $([ -f "$LIN_SIG_FILE" ] && echo yes || echo no)"

          python3 - <<PYEOF
import json
data = {
  "version": "${VERSION}",
  "notes": "Lottery Manager ${TAG} — open Settings > Software Updates to install.",
  "pub_date": "${PUB_DATE}",
  "platforms": {
    "windows-x86_64": {
      "signature": """${WIN_SIG}""",
      "url": "${BASE}/Lottery.Manager_${VERSION}_x64-setup.exe"
    },
    "linux-x86_64": {
      "signature": """${LIN_SIG}""",
      "url": "${BASE}/lottery-manager_${VERSION}_amd64.AppImage"
    },
    "darwin-x86_64": {
      "signature": "",
      "url": "${BASE}/Lottery.Manager_${VERSION}_x64.dmg"
    }
  }
}
print(json.dumps(data, indent=2))
PYEOF
          python3 - > latest.json <<PYEOF
import json
data = {
  "version": "${VERSION}",
  "notes": "Lottery Manager ${TAG} — open Settings > Software Updates to install.",
  "pub_date": "${PUB_DATE}",
  "platforms": {
    "windows-x86_64": {
      "signature": open("${WIN_SIG_FILE}").read().strip() if __import__("os").path.exists("${WIN_SIG_FILE}") else "",
      "url": "${BASE}/Lottery.Manager_${VERSION}_x64-setup.exe"
    },
    "linux-x86_64": {
      "signature": open("${LIN_SIG_FILE}").read().strip() if __import__("os").path.exists("${LIN_SIG_FILE}") else "",
      "url": "${BASE}/lottery-manager_${VERSION}_amd64.AppImage"
    },
    "darwin-x86_64": {
      "signature": "",
      "url": "${BASE}/Lottery.Manager_${VERSION}_x64.dmg"
    }
  }
}
print(json.dumps(data, indent=2))
PYEOF

          # Upload WITHOUT --clobber so we never overwrite a good manifest
          gh release upload "${TAG}" latest.json \
            --repo "Victor-dev-03-cmd/lottery-software"

          echo "✅ Fallback latest.json uploaded."
          cat latest.json
