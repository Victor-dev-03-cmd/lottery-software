name: "Release"

# Trigger: push a version tag matching the version in src-tauri/tauri.conf.json
# Example:   git tag v1.0.25 && git push origin v1.0.25
on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Guard: ensure the git tag matches tauri.conf.json version ─────────────────
  # Prevents the "tag v1.0.24 but assets named 1.0.22" mismatch that caused 404s.
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag == tauri.conf.json version
        id: ver
        run: |
          CONF_VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          echo "tauri.conf.json=$CONF_VERSION  tag=$TAG_VERSION"
          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: tauri.conf.json=$CONF_VERSION  tag=${{ github.ref_name }}"
            echo "::error::Bump version in src-tauri/tauri.conf.json to $TAG_VERSION, commit to main, then re-push the tag."
            exit 1
          fi
          echo "version=$CONF_VERSION" >> "$GITHUB_OUTPUT"

  # ── Build Windows + Linux installers and publish the GitHub Release ────────────
  publish-tauri:
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app and publish GitHub Release
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set these GitHub secrets for signed updates (see README for key generation)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lottery Manager ${{ github.ref_name }}"
          releaseBody: |
            ## Lottery Manager ${{ github.ref_name }}

            ### Update
            - **In-app**: Settings → Software Updates → Check for Updates (silent install)
            - **Windows**: download `lottery-manager_*_x64-setup.exe`
            - **Linux**: download `lottery-manager_*_amd64.deb`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ── Ensure latest.json is present and has correct asset URLs ──────────────────
  # tauri-action generates latest.json automatically when TAURI_SIGNING_PRIVATE_KEY
  # is set. When not set (dangerousInsecure / unsigned mode), this job fills the gap.
  ensure-manifest:
    needs: [verify-version, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate and upload correct latest.json
        # Always runs — overwrites tauri-action's latest.json to guarantee:
        #   1. Correct artifact URLs (updater archives, not installers)
        #   2. Signatures present (from tauri-action's .sig files)
        #   3. No empty "signature":"" fields that crash Tauri's minisign parser
        #
        # ROOT CAUSE the previous version got wrong:
        #   _x64-setup.exe  →  wrong: full NSIS installer, not a zip archive
        #   _amd64.AppImage →  wrong: raw AppImage, not a tar.gz archive
        # Tauri v2 updater protocol requires:
        #   Windows: _x64-setup.nsis.zip  (NSIS installer wrapped in zip)
        #   Linux:   _amd64.AppImage.tar.gz (AppImage wrapped in tar.gz)
        # tauri-action only generates these when TAURI_SIGNING_PRIVATE_KEY is set.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          PRODUCT=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['productName'])")
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Updater artifact names — these are what tauri-action generates when
          # TAURI_SIGNING_PRIVATE_KEY is set (NOT the plain .exe/.AppImage files).
          WIN_ARTIFACT="${PRODUCT}_${VERSION}_x64-setup.nsis.zip"
          LIN_ARTIFACT="${PRODUCT}_${VERSION}_amd64.AppImage.tar.gz"

          # Download all .sig files from the release (tauri-action uploads them alongside
          # each updater archive when signing keys are present)
          mkdir -p sigs
          gh release download "${TAG}" \
            --repo "${{ github.repository }}" \
            --pattern "*.sig" --dir ./sigs/ 2>/dev/null || true

          WIN_SIG=""
          LIN_SIG=""
          [ -f "sigs/${WIN_ARTIFACT}.sig" ] && WIN_SIG=$(cat "sigs/${WIN_ARTIFACT}.sig")
          [ -f "sigs/${LIN_ARTIFACT}.sig" ] && LIN_SIG=$(cat "sigs/${LIN_ARTIFACT}.sig")

          echo "Product=$PRODUCT  Version=$VERSION"
          echo "Win artifact: ${WIN_ARTIFACT}  Sig=${#WIN_SIG}chars"
          echo "Lin artifact: ${LIN_ARTIFACT}  Sig=${#LIN_SIG}chars"

          # Verify the updater archives actually exist in the release.
          WIN_EXISTS=$(gh release view "${TAG}" --repo "${{ github.repository }}" \
            --json assets --jq "[.assets[].name] | contains([\"${WIN_ARTIFACT}\"])" 2>/dev/null || echo "false")
          LIN_EXISTS=$(gh release view "${TAG}" --repo "${{ github.repository }}" \
            --json assets --jq "[.assets[].name] | contains([\"${LIN_ARTIFACT}\"])" 2>/dev/null || echo "false")
          echo "Win archive exists in release: ${WIN_EXISTS}"
          echo "Lin archive exists in release: ${LIN_EXISTS}"

          if [ "$WIN_EXISTS" != "true" ] || [ "$LIN_EXISTS" != "true" ]; then
            echo "::error::Updater archives missing from release!"
            echo "::error::Expected: ${WIN_ARTIFACT} and ${LIN_ARTIFACT}"
            echo "::error::Make sure TAURI_SIGNING_PRIVATE_KEY is set in GitHub repository secrets."
            echo "::error::Without the signing key, tauri-action does not produce updater archives."
            exit 1
          fi

          # Build platform JSON objects. Signature MUST be present — Tauri v2
          # verifies signatures and rejects updates without a valid signature
          # (dangerousInsecure mode was removed in this release).
          WIN_SIG_ESC=$(printf '%s' "$WIN_SIG" | sed 's/\\/\\\\/g; s/"/\\"/g')
          LIN_SIG_ESC=$(printf '%s' "$LIN_SIG" | sed 's/\\/\\\\/g; s/"/\\"/g')

          if [ -z "$WIN_SIG_ESC" ] || [ -z "$LIN_SIG_ESC" ]; then
            echo "::error::Signature files are missing or empty."
            echo "::error::Ensure TAURI_SIGNING_PRIVATE_KEY is set in GitHub repository secrets."
            exit 1
          fi

          WIN_OBJ="{\"signature\":\"$WIN_SIG_ESC\",\"url\":\"$BASE/${WIN_ARTIFACT}\"}"
          LIN_OBJ="{\"signature\":\"$LIN_SIG_ESC\",\"url\":\"$BASE/${LIN_ARTIFACT}\"}"

          printf '{"version":"%s","notes":"Lottery Manager %s","pub_date":"%s","platforms":{"windows-x86_64":%s,"linux-x86_64":%s}}\n' \
            "$VERSION" "$TAG" "$PUB_DATE" "$WIN_OBJ" "$LIN_OBJ" \
            | python3 -m json.tool > latest.json

          echo "Generated latest.json:"
          cat latest.json

          gh release upload "${TAG}" latest.json \
            --repo "${{ github.repository }}" \
            --clobber

          echo "latest.json updated on release ${TAG}."
