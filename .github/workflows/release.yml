name: "Publish"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lottery Manager ${{ github.ref_name }}"
          releaseBody: |
            ## Lottery Manager ${{ github.ref_name }}

            **Windows**: Download `Lottery.Manager_*_x64-setup.exe`
            **Linux**: Download `lottery-manager_*_amd64.deb`

            **In-App Update**: Open Settings → Software Updates → Check for Updates
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Ensure latest.json exists — only uploads if tauri-action did NOT already create one
  upload-manifest:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check and upload latest.json if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/Victor-dev-03-cmd/lottery-software/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Check if tauri-action already uploaded latest.json
          EXISTING=$(gh release view "${TAG}" \
            --repo "Victor-dev-03-cmd/lottery-software" \
            --json assets --jq '[.assets[].name] | contains(["latest.json"])' 2>/dev/null || echo "false")

          if [ "$EXISTING" = "true" ]; then
            echo "latest.json already exists — skipping upload"
            exit 0
          fi

          echo "latest.json missing — generating fallback"

          # Try to download .sig files
          mkdir -p sigs
          gh release download "${TAG}" \
            --repo "Victor-dev-03-cmd/lottery-software" \
            --pattern "*.sig" --dir ./sigs/ 2>/dev/null || true

          WIN_SIG_FILE="sigs/Lottery.Manager_${VERSION}_x64-setup.exe.sig"
          LIN_SIG_FILE="sigs/lottery-manager_${VERSION}_amd64.AppImage.sig"
          WIN_SIG=""
          LIN_SIG=""
          [ -f "$WIN_SIG_FILE" ] && WIN_SIG=$(cat "$WIN_SIG_FILE")
          [ -f "$LIN_SIG_FILE" ] && LIN_SIG=$(cat "$LIN_SIG_FILE")

          # Write latest.json using a simple printf (avoids heredoc YAML issues)
          printf '{\n  "version": "%s",\n  "notes": "Lottery Manager %s",\n  "pub_date": "%s",\n  "platforms": {\n    "windows-x86_64": { "signature": "%s", "url": "%s/Lottery.Manager_%s_x64-setup.exe" },\n    "linux-x86_64":   { "signature": "%s", "url": "%s/lottery-manager_%s_amd64.AppImage" }\n  }\n}\n' \
            "$VERSION" "$TAG" "$PUB_DATE" \
            "$WIN_SIG" "$BASE" "$VERSION" \
            "$LIN_SIG" "$BASE" "$VERSION" > latest.json

          cat latest.json

          # Upload WITHOUT --clobber so we never destroy a valid manifest
          gh release upload "${TAG}" latest.json \
            --repo "Victor-dev-03-cmd/lottery-software"

          echo "Fallback latest.json uploaded"
