name: "Release"

# Trigger: push a version tag matching the version in src-tauri/tauri.conf.json
# Example:   git tag v1.0.25 && git push origin v1.0.25
on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Guard: ensure the git tag matches tauri.conf.json version ─────────────────
  # Prevents the "tag v1.0.24 but assets named 1.0.22" mismatch that caused 404s.
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag == tauri.conf.json version
        id: ver
        run: |
          CONF_VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          echo "tauri.conf.json=$CONF_VERSION  tag=$TAG_VERSION"
          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: tauri.conf.json=$CONF_VERSION  tag=${{ github.ref_name }}"
            echo "::error::Bump version in src-tauri/tauri.conf.json to $TAG_VERSION, commit to main, then re-push the tag."
            exit 1
          fi
          echo "version=$CONF_VERSION" >> "$GITHUB_OUTPUT"

  # ── Build Windows + Linux installers and publish the GitHub Release ────────────
  publish-tauri:
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app and publish GitHub Release
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set these GitHub secrets for signed updates (see README for key generation)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lottery Manager ${{ github.ref_name }}"
          releaseBody: |
            ## Lottery Manager ${{ github.ref_name }}

            ### Update
            - **In-app**: Settings → Software Updates → Check for Updates (silent install)
            - **Windows**: download `lottery-manager_*_x64-setup.exe`
            - **Linux**: download `lottery-manager_*_amd64.deb`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ── Build updater archives + sign if key available + upload latest.json ───────
  # This job is self-contained: it downloads the regular installers produced by
  # publish-tauri, wraps them in the archive formats that the Tauri v2 updater
  # protocol requires, signs them when TAURI_SIGNING_PRIVATE_KEY is set, and
  # generates latest.json. It never blocks on the signing key — if the key is
  # absent the archives are uploaded unsigned and dangerousInsecure mode (set in
  # tauri.conf.json) allows clients to install without signature verification.
  # When the secret is eventually added, remove dangerousInsecure from tauri.conf.json
  # and the next release will produce fully signed, verified updates.
  ensure-manifest:
    needs: [verify-version, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun (for tauri signer sign command)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Build updater archives, sign, upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          PRODUCT=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['productName'])")
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Tauri v2 updater archive names (different from raw installer names)
          WIN_ARTIFACT="${PRODUCT}_${VERSION}_x64-setup.nsis.zip"
          LIN_ARTIFACT="${PRODUCT}_${VERSION}_amd64.AppImage.tar.gz"
          WIN_INSTALLER="${PRODUCT}_${VERSION}_x64-setup.exe"
          LIN_APPIMAGE="${PRODUCT}_${VERSION}_amd64.AppImage"

          mkdir -p artifacts

          # ── Step 1: Check if tauri-action already created the archives ──────
          WIN_EXISTS=$(gh release view "${TAG}" --repo "${{ github.repository }}" \
            --json assets --jq "[.assets[].name] | contains([\"${WIN_ARTIFACT}\"])" 2>/dev/null || echo "false")
          LIN_EXISTS=$(gh release view "${TAG}" --repo "${{ github.repository }}" \
            --json assets --jq "[.assets[].name] | contains([\"${LIN_ARTIFACT}\"])" 2>/dev/null || echo "false")
          echo "Archives already in release — Win:${WIN_EXISTS}  Lin:${LIN_EXISTS}"

          # ── Step 2: Create archives from installers if not already present ──
          if [ "$WIN_EXISTS" != "true" ]; then
            echo "Downloading Windows installer and creating .nsis.zip ..."
            gh release download "${TAG}" \
              --repo "${{ github.repository }}" \
              --pattern "${WIN_INSTALLER}" --dir ./artifacts/ 2>/dev/null || true
            if [ -f "artifacts/${WIN_INSTALLER}" ]; then
              cd artifacts && zip "${WIN_ARTIFACT}" "${WIN_INSTALLER}" && cd ..
              echo "Created ${WIN_ARTIFACT}"
            else
              echo "::warning::Windows installer not in release — skipping Windows archive"
            fi
          else
            # Already exists — download it so we can re-sign if needed
            gh release download "${TAG}" \
              --repo "${{ github.repository }}" \
              --pattern "${WIN_ARTIFACT}" --dir ./artifacts/ 2>/dev/null || true
          fi

          if [ "$LIN_EXISTS" != "true" ]; then
            echo "Downloading Linux AppImage and creating .AppImage.tar.gz ..."
            gh release download "${TAG}" \
              --repo "${{ github.repository }}" \
              --pattern "${LIN_APPIMAGE}" --dir ./artifacts/ 2>/dev/null || true
            if [ -f "artifacts/${LIN_APPIMAGE}" ]; then
              cd artifacts && tar czf "${LIN_ARTIFACT}" "${LIN_APPIMAGE}" && cd ..
              echo "Created ${LIN_ARTIFACT}"
            else
              echo "::warning::Linux AppImage not in release — skipping Linux archive"
            fi
          else
            gh release download "${TAG}" \
              --repo "${{ github.repository }}" \
              --pattern "${LIN_ARTIFACT}" --dir ./artifacts/ 2>/dev/null || true
          fi

          # ── Step 3: Sign archives if TAURI_SIGNING_PRIVATE_KEY is set ───────
          WIN_SIG=""
          LIN_SIG=""

          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "Signing key is available — signing archives ..."
            if [ -f "artifacts/${WIN_ARTIFACT}" ]; then
              bun run tauri -- signer sign "artifacts/${WIN_ARTIFACT}" && \
                WIN_SIG=$(cat "artifacts/${WIN_ARTIFACT}.sig") && \
                echo "Windows archive signed (${#WIN_SIG} chars)"
            fi
            if [ -f "artifacts/${LIN_ARTIFACT}" ]; then
              bun run tauri -- signer sign "artifacts/${LIN_ARTIFACT}" && \
                LIN_SIG=$(cat "artifacts/${LIN_ARTIFACT}.sig") && \
                echo "Linux archive signed (${#LIN_SIG} chars)"
            fi
          else
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY not set — archives will be unsigned."
            echo "::notice::dangerousInsecure:true in tauri.conf.json allows clients to install"
            echo "::notice::unsigned updates. Add the secret and remove dangerousInsecure for"
            echo "::notice::full signature verification."
            # Download any .sig files tauri-action may have created
            mkdir -p sigs
            gh release download "${TAG}" \
              --repo "${{ github.repository }}" \
              --pattern "*.sig" --dir ./sigs/ 2>/dev/null || true
            [ -f "sigs/${WIN_ARTIFACT}.sig" ] && WIN_SIG=$(cat "sigs/${WIN_ARTIFACT}.sig")
            [ -f "sigs/${LIN_ARTIFACT}.sig" ] && LIN_SIG=$(cat "sigs/${LIN_ARTIFACT}.sig")
          fi

          # ── Step 4: Upload archives (and sigs) to the release ───────────────
          WIN_UPLOADED=false
          LIN_UPLOADED=false

          if [ -f "artifacts/${WIN_ARTIFACT}" ]; then
            gh release upload "${TAG}" "artifacts/${WIN_ARTIFACT}" \
              --repo "${{ github.repository }}" --clobber && WIN_UPLOADED=true
            [ -f "artifacts/${WIN_ARTIFACT}.sig" ] && \
              gh release upload "${TAG}" "artifacts/${WIN_ARTIFACT}.sig" \
                --repo "${{ github.repository }}" --clobber
          fi

          if [ -f "artifacts/${LIN_ARTIFACT}" ]; then
            gh release upload "${TAG}" "artifacts/${LIN_ARTIFACT}" \
              --repo "${{ github.repository }}" --clobber && LIN_UPLOADED=true
            [ -f "artifacts/${LIN_ARTIFACT}.sig" ] && \
              gh release upload "${TAG}" "artifacts/${LIN_ARTIFACT}.sig" \
                --repo "${{ github.repository }}" --clobber
          fi

          # ── Step 5: Generate and upload latest.json ──────────────────────────
          WIN_SIG_ESC=$(printf '%s' "$WIN_SIG" | sed 's/\\/\\\\/g; s/"/\\"/g')
          LIN_SIG_ESC=$(printf '%s' "$LIN_SIG" | sed 's/\\/\\\\/g; s/"/\\"/g')

          # Omit signature field when empty — Tauri's minisign parser crashes on ""
          if [ -n "$WIN_SIG_ESC" ]; then
            WIN_OBJ="{\"signature\":\"$WIN_SIG_ESC\",\"url\":\"$BASE/${WIN_ARTIFACT}\"}"
          else
            WIN_OBJ="{\"url\":\"$BASE/${WIN_ARTIFACT}\"}"
          fi
          if [ -n "$LIN_SIG_ESC" ]; then
            LIN_OBJ="{\"signature\":\"$LIN_SIG_ESC\",\"url\":\"$BASE/${LIN_ARTIFACT}\"}"
          else
            LIN_OBJ="{\"url\":\"$BASE/${LIN_ARTIFACT}\"}"
          fi

          printf '{"version":"%s","notes":"Lottery Manager %s","pub_date":"%s","platforms":{"windows-x86_64":%s,"linux-x86_64":%s}}\n' \
            "$VERSION" "$TAG" "$PUB_DATE" "$WIN_OBJ" "$LIN_OBJ" \
            | python3 -m json.tool > latest.json

          echo "Generated latest.json:"
          cat latest.json

          gh release upload "${TAG}" latest.json \
            --repo "${{ github.repository }}" --clobber

          echo "Done. Signed=${#WIN_SIG}/${#LIN_SIG} chars. Win=${WIN_UPLOADED} Lin=${LIN_UPLOADED}"
