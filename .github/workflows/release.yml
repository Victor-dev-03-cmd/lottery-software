name: "Publish"

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Build Windows + Linux installers ────────────────────────────────────────
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys are optional — if set, artifacts are signed.
          # Without them, tauri-action still builds and uploads installers;
          # latest.json is generated by the upload-manifest job below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lottery Manager ${{ github.ref_name }}"
          releaseBody: |
            ## Lottery Manager ${{ github.ref_name }}

            ### Installation
            - **Windows**: Download `Lottery.Manager_*_x64-setup.exe`
            - **Linux (Debian)**: Download `lottery-manager_*_amd64.deb`

            ### In-App Silent Update
            Open **Settings → Software Updates** and click **Check for Updates** — the app will download and restart automatically.

            ---
            *Download the appropriate installer for your platform below.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ── Upload latest.json update manifest (runs after BOTH builds finish) ───────
  upload-manifest:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Strip the leading 'v' to get the version number
          VERSION="${TAG#v}"
          BASE="https://github.com/Victor-dev-03-cmd/lottery-software/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Build the manifest — no signatures required (pubkey removed from tauri.conf.json)
          cat > latest.json <<MANIFEST
          {
            "version": "${VERSION}",
            "notes": "Lottery Manager ${TAG} — open Settings → Software Updates to install.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "",
                "url": "${BASE}/Lottery.Manager_${VERSION}_x64-setup.exe"
              },
              "linux-x86_64": {
                "signature": "",
                "url": "${BASE}/lottery-manager_${VERSION}_amd64.AppImage"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "${BASE}/Lottery.Manager_${VERSION}_x64.dmg"
              },
              "darwin-aarch64": {
                "signature": "",
                "url": "${BASE}/Lottery.Manager_${VERSION}_aarch64.dmg"
              }
            }
          }
          MANIFEST

          # Upload latest.json to the GitHub release (overwrite if exists)
          gh release upload "${TAG}" latest.json --clobber \
            --repo "Victor-dev-03-cmd/lottery-software"

          echo "✅ latest.json uploaded for ${TAG} (version ${VERSION})"
          cat latest.json
