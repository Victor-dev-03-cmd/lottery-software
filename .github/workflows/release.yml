name: "Release"

# Trigger: push a version tag  →  git tag v1.0.25 && git push origin v1.0.25
on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Guard: ensure the git tag matches the version in tauri.conf.json ─────────
  # This prevents the "v1.0.24 tag but 1.0.22 assets" mismatch that caused 404s.
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag == tauri.conf.json version
        id: ver
        run: |
          CONF_VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"   # strip leading 'v'
          echo "tauri.conf.json: $CONF_VERSION   tag: $TAG_VERSION"
          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch — tauri.conf.json is $CONF_VERSION but tag is ${{ github.ref_name }}."
            echo "::error::Run: npm run version-bump $TAG_VERSION, commit, then re-push the tag."
            exit 1
          fi
          echo "version=$CONF_VERSION" >> "$GITHUB_OUTPUT"

  # ── Build + publish (Windows + Linux) ────────────────────────────────────────
  publish-tauri:
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set these secrets for signed updates (see RELEASE.md)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lottery Manager ${{ github.ref_name }}"
          releaseBody: |
            ## Lottery Manager ${{ github.ref_name }}

            ### Install / Update
            - **In-app**: Settings → Software Updates → Check for Updates
            - **Windows**: download `lottery-manager_*_x64-setup.exe`
            - **Linux**: download `lottery-manager_*_amd64.deb`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ── Ensure latest.json is present and correct ────────────────────────────────
  # tauri-action generates latest.json when TAURI_SIGNING_PRIVATE_KEY is set.
  # When it is NOT set (unsigned/dangerousInsecure mode), tauri-action may skip
  # the file. This job generates a correct unsigned latest.json as a fallback.
  ensure-manifest:
    needs: [verify-version, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if tauri-action already uploaded latest.json
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HAS=$(gh release view "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '[.assets[].name] | contains(["latest.json"])' 2>/dev/null || echo "false")
          echo "has_manifest=$HAS" >> "$GITHUB_OUTPUT"

      - name: Generate and upload latest.json (unsigned fallback)
        if: steps.check.outputs.has_manifest != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # Read version from tauri.conf.json — this is the canonical source of truth.
          # It MUST match the tag (enforced by verify-version above).
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          PRODUCT=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['productName'])")
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Try to fetch .sig files (present only when signing keys are set)
          mkdir -p sigs
          gh release download "${TAG}" \
            --repo "${{ github.repository }}" \
            --pattern "*.sig" --dir ./sigs/ 2>/dev/null || true

          # Read signatures if available, otherwise leave empty (dangerousInsecure mode)
          WIN_SIG_FILE="sigs/${PRODUCT}_${VERSION}_x64-setup.exe.sig"
          LIN_SIG_FILE="sigs/${PRODUCT}_${VERSION}_amd64.AppImage.sig"
          WIN_SIG=""; LIN_SIG=""
          [ -f "$WIN_SIG_FILE" ] && WIN_SIG=$(cat "$WIN_SIG_FILE")
          [ -f "$LIN_SIG_FILE" ] && LIN_SIG=$(cat "$LIN_SIG_FILE")

          # Verify the actual installer files exist in the release
          WIN_EXISTS=$(gh release view "${TAG}" --repo "${{ github.repository }}" \
            --json assets --jq "[.assets[].name] | contains([\"${PRODUCT}_${VERSION}_x64-setup.exe\"])")
          LIN_EXISTS=$(gh release view "${TAG}" --repo "${{ github.repository }}" \
            --json assets --jq "[.assets[].name] | contains([\"${PRODUCT}_${VERSION}_amd64.AppImage\"])")

          echo "Product: $PRODUCT  Version: $VERSION"
          echo "Windows asset exists: $WIN_EXISTS"
          echo "Linux asset exists:   $LIN_EXISTS"

          # Write latest.json — asset URLs use exact same naming as tauri-action produces
          python3 - <<PYEOF
import json, os
manifest = {
    "version": os.environ.get("VERSION", ""),
    "notes": f"Lottery Manager {os.environ.get('TAG', '')}",
    "pub_date": os.environ.get("PUB_DATE", ""),
    "platforms": {
        "windows-x86_64": {
            "signature": os.environ.get("WIN_SIG", ""),
            "url": f"{os.environ['BASE']}/{os.environ['PRODUCT']}_{os.environ['VERSION']}_x64-setup.exe"
        },
        "linux-x86_64": {
            "signature": os.environ.get("LIN_SIG", ""),
            "url": f"{os.environ['BASE']}/{os.environ['PRODUCT']}_{os.environ['VERSION']}_amd64.AppImage"
        }
    }
}
with open("latest.json", "w") as f:
    json.dump(manifest, f, indent=2)
    f.write("\n")
PYEOF

          export VERSION TAG PUB_DATE WIN_SIG LIN_SIG BASE PRODUCT

          cat latest.json

          gh release upload "${TAG}" latest.json \
            --repo "${{ github.repository }}" \
            --clobber

          echo "latest.json uploaded successfully."
